<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document Object Model</title>

    <link rel="stylesheet" type="text/css" href="./css/styles.css">
    <script src="./js/javascript.js"></script>
  </head>

  <body>
    <div class="contenedor">
      <h1 class="titulo">Document Object Model</h1>
      <form class="formulario">
        <label for="num1">X:</label>
        <input type="number" id="num1" class="campo" required>

        <label for="operacion">Operación:</label>
        <select id="operacion" class="campo">
          <option value="sumar">Sumar</option>
          <option value="restar">Restar</option>
          <option value="multiplicar">Multiplicar</option>
          <option value="dividir">Dividir</option>
        </select>

        <label for="num2">Y:</label>
        <input type="number" id="num2" class="campo" required>

        <div>Resultado: </div>
        <div id="resultado"></div>

        <button id="calcular" class="boton">Calcular</button>

      </form>
    </div>
  </body>
</html>
